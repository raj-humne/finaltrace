# Serves the built SPA and proxies /api to the api container by its
# docker-compose service name - same-origin from the browser's point of view,
# so the session cookie (api/settings.py) needs no cross-origin handling.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The session cookie must round-trip untouched for auth to work.
        proxy_pass_request_headers on;
    }

    # react-router-dom client-side routing: any path that isn't a real static
    # file falls back to index.html so a direct load of e.g. /incidents/INC-1
    # is handled by the SPA router instead of 404ing at nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
