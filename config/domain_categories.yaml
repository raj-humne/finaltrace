# Domain -> category mapping. Data, not code. See docs/03-DATA-MODEL.md section 1.7.
# Matching is by exact host or by suffix (a leading "." marks a suffix rule).

categories:
  job_search:
    - indeed.com
    - monster.com
    - careerbuilder.com
    - glassdoor.com
    - linkedin.com/jobs
    - simplyhired.com
    - dice.com
    - ziprecruiter.com
    - naukri.com
    - jobsearch.com

  cloud_storage:
    - dropbox.com
    - box.com
    - mega.nz
    - mediafire.com
    - rapidshare.com
    - wetransfer.com
    - sendspace.com
    - 4shared.com
    - filedropper.com

  leak_platform:
    - wikileaks.org
    - pastebin.com
    - ghostbin.com
    - cryptome.org
    - leakforums.net

  hacking_tools:
    - keylogger.org
    - spectorsoft.com
    - actualkeylogger.com
    - refog.com
    - wellresearchedreviews.com
    - bestkeylogger.net
    - hackforums.net

  webmail:
    - gmail.com
    - mail.yahoo.com
    - outlook.com
    - hotmail.com
    - protonmail.com
    - mail.com

# Request shapes treated as upload-like when no byte counts are available.
upload_path_markers:
  - /upload
  - /share
  - /send
  - /put
  - /post
  - /submit

# Domains treated as personal for the self-send rule.
personal_email_domains:
  - gmail.com
  - yahoo.com
  - hotmail.com
  - outlook.com
  - protonmail.com
  - aol.com
  - mail.com
