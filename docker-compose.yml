# Local demo deployment (docs/02-ARCHITECTURE.md section 7).
#
#   docker compose up --build
#     -> db, api, web. Serves whatever is already in ./data (committed
#        precomputed artifacts for a stable demo, or nothing yet).
#
#   docker compose --profile pipeline run --build runner
#     -> re-runs the real detection pipeline against ./data/raw and writes
#        fresh Parquet artifacts + an evaluation report. Not part of the
#        default `up` - a pipeline run can take minutes on the real corpus
#        and should be an explicit, deliberate action, never implied by
#        starting the demo.
#
#   docker compose exec api python -m api.cli create-user \
#       --username you --display-name "Your Name" --role detection_engineer
#     -> the ONLY way to get a login. No default credentials exist anywhere
#        in this repo or image, by design (api/cli.py prompts interactively
#        for the password, which is why this must be `exec`, not `run`).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentineltrace
      POSTGRES_USER: sentineltrace
      POSTGRES_PASSWORD: sentineltrace_dev_only
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentineltrace"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      SENTINEL_DB: postgresql+psycopg://sentineltrace:sentineltrace_dev_only@db:5432/sentineltrace
      SENTINEL_CORS_ORIGINS: "http://localhost:8080"
      SENTINEL_COOKIE_SECURE: "false"  # plain HTTP for the local demo; set true behind real TLS
    volumes:
      - ./data:/srv/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

  # One-shot pipeline run. Never starts with `docker compose up` - only via
  # `--profile pipeline run runner`, per docs/02 section 7.
  runner:
    build:
      context: .
      dockerfile: Dockerfile.api
    profiles: ["pipeline"]
    environment:
      SENTINEL_DB: postgresql+psycopg://sentineltrace:sentineltrace_dev_only@db:5432/sentineltrace
    volumes:
      - ./data:/srv/data
    depends_on:
      db:
        condition: service_healthy
    # Full engine pipeline against the real corpus, then the evaluation
    # report against the same data. Both steps' real-data guards (loader
    # reads whatever is under data/raw; engine.eval.report refuses to run
    # without data/artifacts/dataset_profile.json marking data_source as
    # real_cert_r42 - see engine/eval/harness.py) apply exactly as they do
    # outside Docker; nothing about running in a container relaxes them.
    command: >
      sh -c "python -m engine.run --raw-dir data/raw/r4.2 --out-dir data/artifacts &&
             python -m engine.eval.report --raw-dir data/raw/r4.2"

volumes:
  db_data:
